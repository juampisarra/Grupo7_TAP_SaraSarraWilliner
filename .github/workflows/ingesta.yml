name: Ingesta Semanal de Propiedades

on:
  # Lunes a las 00:00 de Argentina (03:00 UTC)
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Operación a ejecutar (reconstruir no hace scraping)'
        required: true
        default: ingesta
        type: choice
        options:
          - ingesta
          - reconstruir
          - limpiar_indices
          - diagnosticar_coordenadas
          - enriquecer_coordenadas
      aplicar_limpieza:
        description: 'Borrar índices candidatos: solo para modo limpiar_indices, desmarcado = vista previa'
        default: false
        type: boolean
      fuente_coordenadas:
        description: 'Fuente: solo para los modos de coordenadas'
        default: Gaggiotti
        type: choice
        options:
          - Gaggiotti
          - Brega
          - Avantix
          - todas
      limite_coordenadas:
        description: 'Máximo de candidatos por ejecución de enriquecimiento'
        default: '10'
        type: choice
        options: ['10', '25', '100']
      desde_id_coordenadas:
        description: 'Procesar IDs mayores a este valor (permite continuar otro lote)'
        default: 0
        type: number
      consultar_coordenadas:
        description: 'Consultar proveedor y guardar caché, sin corregir publicaciones'
        default: false
        type: boolean
      aplicar_coordenadas:
        description: 'Consultar y aplicar solo coincidencias validadas (implica consultar)'
        default: false
        type: boolean

concurrency:
  group: ingesta_propiedades
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DJANGO_DEBUG: 'False'
      DB_ENGINE: postgresql
      ELASTICSEARCH_INDEX: propiedades
      NOMINATIM_DOMAIN: ${{ vars.NOMINATIM_DOMAIN || 'nominatim.openstreetmap.org' }}
      NOMINATIM_USER_AGENT: ${{ vars.NOMINATIM_USER_AGENT || 'Grupo7-TAP/0.2 (https://github.com/juampisarra/Grupo7_TAP_SaraSarraWilliner)' }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar migraciones y servicios necesarios
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
          MODO: ${{ inputs.modo }}
        run: |
          python manage.py migrate --check
          if [ "$MODO" != 'diagnosticar_coordenadas' ] && [ "$MODO" != 'enriquecer_coordenadas' ]; then
            python manage.py comprobar_elasticsearch
          fi

      - name: Diagnóstico o enriquecimiento de coordenadas
        if: ${{ success() && (inputs.modo == 'diagnosticar_coordenadas' || inputs.modo == 'enriquecer_coordenadas') }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          MODO: ${{ inputs.modo }}
          FUENTE: ${{ inputs.fuente_coordenadas }}
          LIMITE: ${{ inputs.limite_coordenadas }}
          DESDE_ID: ${{ inputs.desde_id_coordenadas }}
          CONSULTAR: ${{ inputs.consultar_coordenadas }}
          APLICAR: ${{ inputs.aplicar_coordenadas }}
        shell: bash
        run: |
          argumentos=()
          if [ "$FUENTE" != 'todas' ]; then
            argumentos+=(--fuente "$FUENTE")
          fi
          if [ "$MODO" = 'enriquecer_coordenadas' ]; then
            argumentos+=(--limite "$LIMITE" --desde-id "$DESDE_ID")
            if [ "$APLICAR" = 'true' ]; then
              argumentos+=(--aplicar)
            elif [ "$CONSULTAR" = 'true' ]; then
              argumentos+=(--consultar)
            fi
          fi
          python manage.py "$MODO" "${argumentos[@]}"

      - name: Ejecutar ingesta
        id: ingesta
        if: ${{ github.event_name == 'schedule' || inputs.modo == 'ingesta' }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
        # Mantener el paso fallido para que el job avise, pero publicar su código
        # de salida para permitir indexar cuando alguna fuente terminó bien.
        shell: bash
        run: |
          set +e
          python manage.py importar_propiedades
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit "$codigo"

      - name: Reconstruir índice de Elasticsearch
        # 0: todas completadas; 3: al menos una completada y alguna fallida.
        # No ejecutar ante fallo total, pasos previos fallidos o cancelación.
        if: ${{ !cancelled() && ((inputs.modo == 'reconstruir' && success()) || steps.ingesta.outputs.codigo == '0' || steps.ingesta.outputs.codigo == '3') }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
        run: python manage.py reconstruir_indice

      - name: Vista previa o limpieza de índices antiguos
        if: ${{ success() && inputs.modo == 'limpiar_indices' }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
          APLICAR_LIMPIEZA: ${{ inputs.aplicar_limpieza }}
        shell: bash
        run: |
          if [ "$APLICAR_LIMPIEZA" = 'true' ]; then
            python manage.py limpiar_indices --aplicar
          else
            python manage.py limpiar_indices
          fi
