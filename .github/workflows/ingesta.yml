name: Ingesta Semanal de Propiedades

on:
  # Lunes a las 00:00 de Argentina (03:00 UTC)
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

concurrency:
  group: ingesta_propiedades
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DJANGO_DEBUG: 'False'
      DB_ENGINE: postgresql
      ELASTICSEARCH_INDEX: propiedades

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar Elasticsearch
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
        run: python manage.py comprobar_elasticsearch

      - name: Ejecutar ingesta
        id: ingesta
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
        # Mantener el paso fallido para que el job avise, pero publicar su código
        # de salida para permitir indexar cuando alguna fuente terminó bien.
        shell: bash
        run: |
          set +e
          python manage.py importar_propiedades
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit "$codigo"

      - name: Reconstruir índice de Elasticsearch
        # 0: todas completadas; 3: al menos una completada y alguna fallida.
        # No ejecutar ante fallo total, pasos previos fallidos o cancelación.
        if: ${{ !cancelled() && (steps.ingesta.outputs.codigo == '0' || steps.ingesta.outputs.codigo == '3') }}
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
        run: python manage.py reconstruir_indice
